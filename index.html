<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zeus</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 6 8 1l7 5z' fill='%23c0643b'/%3E%3Cpath d='M3 7h2v6H3zm4 0h2v6H7zm4 0h2v6h-2zM1 14h14v2H1z' fill='%23f3ead8' stroke='%233b2a1a' stroke-width='.5'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <canvas id="view"></canvas>
    <header id="topbar">
      <span id="population"></span>
      <span id="labor"></span>
      <span id="treasury"></span>
      <span id="date"></span>
      <span id="status"></span>
      <button id="ledger-button" title="Ledger (L)">Ledger</button>
      <button id="world-button" title="Trade partners">World</button>
      <button id="notices-button" title="Recent notices (N)">Notices</button>
      <div id="map-mode">
        <button id="map-button" title="Map modes (O toggles the last one)"></button>
        <div id="map-menu" hidden></div>
        <div id="map-ramp" hidden></div>
      </div>
      <div id="speed"></div>
    </header>
    <div id="notice-feed"></div>
    <aside id="notice-log" hidden>
      <button id="notice-log-close" aria-label="Close">×</button>
      <h2>Notices</h2>
      <ol id="notice-log-lines"></ol>
    </aside>
    <aside id="ledger" hidden>
      <nav id="ledger-chapters"></nav>
      <div id="ledger-content">
        <button id="ledger-close" aria-label="Close">×</button>
        <h2 id="ledger-title"></h2>
        <div id="ledger-page"></div>
      </div>
    </aside>
<aside id="world" hidden>
  <button id="world-close" aria-label="Close">×</button>
  <h2>World</h2>
  <p id="world-prompt" hidden></p>
  <div id="world-body">
    <div id="world-map"></div>
    <div id="world-details"></div>
  </div>
</aside>
    <nav id="toolbar"></nav>
    <div id="map-tooltip" hidden></div>
    <aside id="inspector" hidden>
      <button id="inspector-close" aria-label="Close">×</button>
      <h2 id="inspector-title"></h2>
      <ul id="inspector-lines"></ul>
      <div id="inspector-meters"></div>
      <div id="inspector-storehouse" hidden></div>
      <div id="inspector-yard" hidden></div>
      <div id="inspector-actions" hidden></div>
    </aside>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
