<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zeus</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 6 8 1l7 5z' fill='%23c0643b'/%3E%3Cpath d='M3 7h2v6H3zm4 0h2v6H7zm4 0h2v6h-2zM1 14h14v2H1z' fill='%23f3ead8' stroke='%233b2a1a' stroke-width='.5'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <canvas id="view"></canvas>
    <header id="topbar">
      <span id="population"></span>
      <span id="labor"></span>
      <span id="treasury"></span>
      <span id="date"></span>
      <span id="status"></span>
      <div id="speed"></div>
      <button id="appeal-toggle" title="Show appeal (O)">Appeal</button>
    </header>
    <nav id="toolbar"></nav>
    <nav id="tool-menu" hidden></nav>
    <aside id="appeal-legend" hidden>
      <strong>Appeal</strong>
      <div id="appeal-legend-bar"></div>
      <div id="appeal-legend-scale"><span id="appeal-legend-low"></span><span>0</span><span id="appeal-legend-high"></span></div>
    </aside>
    <aside id="inspector" hidden>
      <button id="inspector-close" aria-label="Close">×</button>
      <h2 id="inspector-title"></h2>
      <ul id="inspector-lines"></ul>
    </aside>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
